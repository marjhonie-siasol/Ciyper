<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating AI Chat Widget</title>
  <!-- Tailwind CSS v2 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-transparent overflow-hidden w-full h-full select-none">
  <div class="w-full h-full flex flex-col items-center justify-start p-2" id="widget-container">
    
    <!-- FIRST FLOATING: Control Bar (Top Pill) -->
    <header class="bg-theme-bg border border-theme-border rounded-full drag-handle" id="control-bar">
      <!-- Audio Wave GIF -->
      <div class="flex items-center justify-center flex-shrink-0">
        <img src="icons8-wave-100.apng.png" alt="audio-wave" class="w-8 h-8 object-contain icon-theme opacity-80" id="audio-wave-gif">
      </div>
 
      <!-- Recording Close Button -->
      <button id="recording-close-btn" class="w-8 h-8 rounded-full bg-theme-btn flex items-center justify-center hover:opacity-80 transition-opacity no-drag flex-shrink-0" title="Close App">
        <img src="https://img.icons8.com/forma-bold-filled-sharp/96/circled.png" alt="circled" class="w-4 h-4 icon-theme">
      </button>
 
      <!-- Session Duration Timer -->
      <span class="text-white text-sm font-semibold tracking-wide select-none flex-shrink-0" id="session-timer">00:00</span>
 
      <!-- Chevron expand/collapse toggle -->
      <button id="expand-toggle-btn" class="w-8 h-8 rounded-full bg-theme-btn flex items-center justify-center hover:opacity-80 transition-opacity no-drag flex-shrink-0" title="Toggle Chat Panel">
        <img src="https://img.icons8.com/ios-filled/100/expand-arrow--v1.png" alt="expand-arrow" class="w-4 h-4 icon-theme transition-transform duration-300" id="chevron-icon">
      </button>
 
      <!-- 3 dots menu -->
      <button id="menu-btn" class="w-8 h-8 rounded-full bg-theme-btn flex items-center justify-center hover:opacity-80 transition-opacity no-drag flex-shrink-0" title="Menu">
        <img src="https://img.icons8.com/glyph-neue/64/menu-2.png" alt="menu-2" class="w-4 h-4 icon-theme">
      </button>
    </header>
 
    <!-- SECOND FLOATING: Chat Panel (Below Control Bar) -->
    <div class="mt-3 bg-theme-bg border border-theme-border rounded-2xl flex flex-col transition-all duration-300 overflow-hidden collapsed-panel" id="chat-panel">
      <!-- Input Controls Row -->
      <div class="flex items-center justify-between p-3.5 space-x-3 border-b border-theme-border">
        <!-- Chat input container -->
        <div class="flex-grow flex items-center border rounded-full px-3 py-1.5 focus-within:border-blue-500 transition-colors" id="chat-input-wrapper">
          <input type="text" id="chat-input" placeholder="Ask here..." autocomplete="off" class="w-full bg-transparent text-white text-sm outline-none placeholder-gray-600">
          <button id="send-btn" class="w-8 h-8 rounded-full bg-theme-btn flex items-center justify-center hover:opacity-85 transition-opacity flex-shrink-0" disabled>
            <img src="https://img.icons8.com/ios-filled/100/down--v1.png" alt="send" class="w-4 h-4 icon-theme transform">
          </button>
        </div>
 
        <!-- Screenshot Button -->
        <button id="screenshot-btn" class="w-8 h-8 rounded-lg bg-theme-btn flex items-center justify-center hover:opacity-85 transition-opacity flex-shrink-0" title="Take Screenshot">
          <img src="https://img.icons8.com/windows/96/screenshot.png" alt="screenshot" class="w-4 h-4 icon-theme">
        </button>
      </div>
 
      <!-- Chat Response Area -->
      <main class="flex-grow p-4 overflow-y-auto" id="chat-container">
        <div class="messages-list flex flex-col space-y-3" id="messages-list">
          <div class="message ai" id="listening-indicator">
            AI is listening right now...
          </div>
        </div>
      </main>
 
      <!-- Footer Bar -->
      <footer class="flex items-center justify-between px-4 py-2.5 border-t border-theme-border">
        <span class="text-xs text-gray-500 font-medium tracking-wide">powered by Gemini</span>
        <!-- Resize handle -->
        <div class="cursor-se-resize flex items-center justify-center" id="resize-handle">
          <img src="https://img.icons8.com/forma-light/96/resize--v2.png" alt="resize" class="w-4 h-4 icon-theme opacity-50 transition-opacity hover:opacity-80">
        </div>
      </footer>
    </div>
 
  </div>
 
  <script src="renderer.js"></script>
</body>
</html>
