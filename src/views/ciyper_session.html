<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciyper</title>
  <!-- Tailwind CSS v2 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-transparent overflow-hidden w-full h-full m-0 p-0">
  <div class="w-full h-full flex flex-col items-center justify-start p-0 m-0 overflow-hidden" id="widget-container">
    
    <!-- FIRST ROW: Stop Session Floating Circle + Floating Control Bar -->
    <div class="flex items-center justify-center no-drag flex-shrink-0" id="top-bar-container">
      <!-- Stop Session Floating Circle -->
      <div class="w-12 h-12 rounded-full bg-theme-bg border border-theme-border flex items-center justify-center flex-shrink-0" id="stop-pill-container">
        <button id="recording-close-btn" class="w-8 h-8 rounded-full bg-theme-btn flex items-center justify-center hover:opacity-80 transition-opacity no-drag flex-shrink-0 cursor-pointer" title="End Session & Save">
          <img src="../../assets/icons/circled.png" alt="circled" class="w-4 h-4 icon-theme">
        </button>
      </div>

      <!-- FIRST FLOATING: Control Bar (Top Pill) -->
      <header class="bg-theme-bg border border-theme-border rounded-full drag-handle" id="control-bar">
        <!-- Play / Pause Audio Listening Button (First on left) -->
        <button id="playback-toggle-btn" class="w-8 h-8 rounded-full bg-theme-btn flex items-center justify-center hover:opacity-80 transition-opacity no-drag flex-shrink-0" title="Pause AI Listening">
          <img src="../../assets/icons/pause.png" alt="pause" class="w-4 h-4 icon-theme" id="playback-toggle-icon">
        </button>

        <!-- Session Wave Indicator -->
        <div class="flex items-center justify-center flex-shrink-0">
          <img src="../../assets/icons/session.play.png" alt="session-wave" class="w-8 h-8 object-contain icon-theme opacity-80" id="audio-wave-gif">
        </div>
 
        <!-- Session Duration Timer -->
        <span class="text-white text-sm font-semibold tracking-wide select-none flex-shrink-0" id="session-timer">00:00</span>
 
        <!-- Chevron expand/collapse toggle -->
        <button id="expand-toggle-btn" class="w-8 h-8 rounded-full bg-theme-btn flex items-center justify-center hover:opacity-80 transition-opacity no-drag flex-shrink-0" title="Toggle Chat Panel">
          <img src="../../assets/icons/expand-arrow.png" alt="expand-arrow" class="w-4 h-4 icon-theme transition-transform duration-300" id="chevron-icon">
        </button>
 
        <!-- 3 dots menu -->
        <button id="menu-btn" class="w-8 h-8 rounded-full bg-theme-btn flex items-center justify-center hover:opacity-80 transition-opacity no-drag flex-shrink-0" title="Menu">
          <img src="../../assets/icons/menu-2.png" alt="menu-2" class="w-4 h-4 icon-theme transition-transform duration-300" id="menu-icon">
        </button>
      </header>
    </div>
 
    <!-- SECOND FLOATING: Chat Panel (Below Control Bar) -->
    <div class="mt-3 bg-theme-bg border border-theme-border rounded-2xl flex flex-col transition-all duration-300 overflow-hidden collapsed-panel" id="chat-panel">
      <!-- Input Controls Row -->
      <div class="flex items-center justify-between p-3.5 space-x-3 border-b border-theme-border">
        <!-- Chat input container -->
        <div class="flex-grow flex items-center border rounded-full px-3 py-1.5 focus-within:border-blue-500 transition-colors" id="chat-input-wrapper">
          <input type="text" id="chat-input" placeholder="Ask here..." autocomplete="off" class="w-full bg-transparent text-white text-sm outline-none placeholder-gray-600">
          <button id="send-btn" class="w-8 h-8 rounded-full bg-theme-btn flex items-center justify-center hover:opacity-85 transition-opacity flex-shrink-0" disabled>
            <img src="../../assets/icons/send-down.png" alt="send" class="w-4 h-4 icon-theme transform">
          </button>
        </div>
 
        <!-- Screenshot Button Container -->
        <div class="relative flex-shrink-0" id="screenshot-wrapper">
          <button id="screenshot-btn" class="w-8 h-8 rounded-lg bg-theme-btn flex items-center justify-center hover:opacity-85 transition-opacity overflow-hidden relative" title="Take Screenshot">
            <img src="../../assets/icons/screenshot.png" alt="screenshot" class="w-4 h-4 icon-theme" id="screenshot-default-icon">
            <img id="screenshot-preview-thumb" class="w-full h-full object-cover hidden rounded-lg" alt="preview">
            <div id="screenshot-remove-overlay" class="absolute inset-0 bg-black bg-opacity-75 hidden items-center justify-center cursor-pointer transition-opacity" title="Remove Screenshot">
              <img src="../../assets/icons/close-x.png" alt="remove" class="w-3.5 h-3.5 icon-theme">
            </div>
          </button>
        </div>
      </div>
 
      <!-- Chat Response Area -->
      <main class="flex-grow p-4 overflow-y-auto" id="chat-container">
        <div class="messages-list flex flex-col space-y-3" id="messages-list">
          <div class="message ai" id="listening-indicator">
            AI is listening right now...
          </div>
        </div>
      </main>
 
      <!-- Footer Bar -->
      <footer class="flex items-center justify-between px-4 py-2.5 border-t border-theme-border">
        <span class="text-xs text-gray-500 font-medium tracking-wide">powered by Groq AI</span>
        <!-- Resize handle -->
        <div class="cursor-se-resize flex items-center justify-center" id="resize-handle">
          <img src="../../assets/icons/resize.png" alt="resize" class="w-4 h-4 icon-theme opacity-50 transition-opacity hover:opacity-80">
        </div>
      </footer>
    </div>
 
    <!-- Floating Menu Dropdown/Modal (Absolute, positioned dynamically) -->
    <div id="session-menu-modal" class="absolute flex rounded-2xl p-3.5 z-50 flex-col space-y-3.5 no-drag bg-theme-bg border border-theme-border collapsed-menu" style="width: 250px; min-width: 250px; backdrop-filter: blur(6px);">
      <!-- Invisible Mode Row (Top) -->
      <div class="flex items-center justify-between w-full">
        <span class="text-xs font-semibold text-gray-300">Invisible Mode</span>
        <!-- Custom toggle switch -->
        <label class="switch flex-shrink-0">
          <input type="checkbox" id="session-invisible-toggle">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Dropdown Container (Below) -->
      <div class="relative w-full">
        <!-- Custom styled dropdown trigger -->
        <div id="session-model-dropdown" class="flex items-center justify-between border rounded-lg px-2.5 py-1.5 cursor-pointer select-none" style="background-color: rgba(19, 19, 19, 0.7); border-color: rgba(47, 47, 47, 0.7);">
          <span id="session-model-value" class="text-xs text-gray-400 font-normal truncate">Select Model</span>
          <img src="../../assets/icons/expand-arrow.png" alt="arrow" class="w-2.5 h-2.5 icon-theme transition-transform duration-200" id="session-model-arrow">
        </div>
        
        <!-- Custom styled dropdown list -->
        <div id="session-model-options" class="absolute left-0 right-0 top-full mt-1.5 border rounded-lg z-50 hidden flex-col overflow-hidden bg-theme-bg border-theme-border" style="border-color: rgba(47, 47, 47, 0.7); backdrop-filter: blur(6px);">
          <div class="session-option flex items-center justify-between px-3 py-2 text-xs text-white cursor-pointer transition-colors" data-value="openai/gpt-oss-120b">
            <span>openai/gpt-oss-120b</span>
            <img src="../../assets/icons/checkmark.png" alt="check" class="w-3.5 h-3.5 icon-theme checkmark-icon hidden">
          </div>
          <div class="session-option flex items-center justify-between px-3 py-2 text-xs text-white cursor-pointer transition-colors" data-value="openai/gpt-oss-20b">
            <span>openai/gpt-oss-20b</span>
            <img src="../../assets/icons/checkmark.png" alt="check" class="w-3.5 h-3.5 icon-theme checkmark-icon hidden">
          </div>
          <div class="session-option flex items-center justify-between px-3 py-2 text-xs text-white cursor-pointer transition-colors" data-value="qwen/qwen3.8-27b">
            <span>qwen/qwen3.8-27b</span>
            <img src="../../assets/icons/checkmark.png" alt="check" class="w-3.5 h-3.5 icon-theme checkmark-icon hidden">
          </div>
        </div>
      </div>

      <!-- Version Footer -->
      <div class="pt-1 flex items-center justify-center w-full">
        <span class="app-version-tag text-gray-500 font-medium tracking-wide" id="session-app-version" style="font-size: 10px; font-family: var(--font-family); color: #6B7280;">Ciyper v1.0.0</span>
      </div>
    </div>

  </div>
 
  <script src="../renderer/prism.js"></script>
  <script src="../renderer/rag.js"></script>
  <script src="../renderer/renderer.js"></script>
</body>
</html>
